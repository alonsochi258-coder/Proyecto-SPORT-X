<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SPORTX</title>
<style>
:root{--bg:#0b1020;--s:#141b2e;--s2:#1f2a47;--t:#f1f5f9;--m:#8b97b1;--a:#f5a524;--b:#2dd4bf}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input{font-family:inherit}button{cursor:pointer}
.app{max-width:640px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 0}
h1{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
h2{font-size:15px;color:var(--m);font-weight:600;margin:24px 0 10px}
.m{color:var(--m);font-size:14px}
.card{background:var(--s);border-radius:20px;padding:16px;margin-bottom:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--m)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;background:var(--a);color:#1a1200;margin-top:12px}
.btn.g{background:var(--s2);color:var(--t)}.btn.sm{width:auto;padding:10px 16px;margin:0}
.btn:active,.ex:active{transform:scale(.97)}
.hero{display:flex;align-items:center;gap:18px;margin-top:20px;background:linear-gradient(135deg,#1f2a47,#141b2e)}
.big{font-size:30px;font-weight:800;margin:4px 0 8px}
.badge{display:inline-block;color:#111;font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:0;background:var(--s);color:var(--m);padding:10px 16px;border-radius:99px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--a);color:#1a1200}
.ex{display:flex;align-items:center;gap:14px;cursor:pointer}.ex b{font-size:16px}
.ic{font-size:30px;width:44px;text-align:center}.go{margin-left:auto;color:var(--m);font-size:24px}
.bar{height:10px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));border-radius:9px}
.sp{display:flex;align-items:center;gap:12px}
.lb{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px}.lb b{width:30px}.lb span{flex:1}.lb em{font-style:normal;color:var(--m)}
.lb.you{background:var(--s2);outline:1px solid var(--a)}
.av{width:36px;height:36px;border-radius:50%;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;bottom:0;left:0;right:0;background:#141b2ee8;backdrop-filter:blur(14px);border-top:1px solid #ffffff12;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav div{display:flex;max-width:640px;margin:0 auto}
nav button{flex:1;background:0;border:0;color:var(--m);padding:10px 0 8px;font-size:12px;font-weight:600}
nav button.on{color:var(--a)}nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
#ses,#auth{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto}#ses{display:none}
.center{text-align:center;padding-top:14px}.bigic{font-size:76px;margin-top:10px}
.timer{font-size:76px;font-weight:800;letter-spacing:2px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.st{font-weight:700;color:var(--a);margin:6px 0 18px}
textarea{width:100%;background:var(--s2);border:1px solid #ffffff14;color:var(--t);border-radius:14px;padding:15px;font-size:16px;margin-top:12px;font-family:inherit;resize:none}
input{width:100%;background:var(--s);border:1px solid #ffffff14;color:var(--t);border-radius:14px;padding:15px;font-size:16px;margin-top:10px}
input:focus{outline:2px solid var(--a)}
.err{color:#fb7185;font-size:14px;margin-top:10px;min-height:18px}
.lnk{background:0;border:0;color:var(--a);font-weight:600;font-size:14px;padding:10px}
.fr{display:flex;gap:8px}.fr input{margin:0}
.bg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bd{text-align:center;padding:12px 4px;border-radius:16px;background:var(--s);font-size:11px;color:var(--m)}.bd i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}.bd.off{opacity:.35;filter:grayscale(1)}
#pk{position:fixed;inset:0;background:#000b;z-index:25;display:none;align-items:flex-end}.sh{background:var(--s);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.ag{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}
#tt{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--s2);padding:12px 18px;border-radius:14px;z-index:30;display:none;max-width:90%;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.lg{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.lg::before{content:"";position:absolute;top:-150px;left:50%;width:460px;height:460px;transform:translateX(-50%);background:radial-gradient(circle,#f5a52438,transparent 65%);pointer-events:none}
.lg::after{content:"";position:absolute;bottom:-180px;right:-140px;width:380px;height:380px;background:radial-gradient(circle,#2dd4bf22,transparent 65%);pointer-events:none}
.lg-in{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto;text-align:center;animation:lgup .5s ease both}
@keyframes lgup{from{opacity:0;transform:translateY(14px)}}
.lg-logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:linear-gradient(145deg,#ffc14d,#f5a524 55%,#c27a00);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px #f5a52459,inset 0 1px 0 #ffffff66}
.lg-h{font-size:38px;font-weight:800;letter-spacing:4px}.lg-h span{color:var(--a)}
.lg-tag{color:var(--m);margin:10px auto 16px;max-width:300px;line-height:1.45}
.lg-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.lg-pills span{background:#ffffff0d;border:1px solid #ffffff12;color:var(--t);font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px}
.lg-card{background:linear-gradient(160deg,#1f2a47aa,#141b2e);border:1px solid #ffffff12;border-radius:24px;padding:18px;text-align:left}
.lg-card input{background:#0b1020aa}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:15px;background:#fff;color:#1f1f1f;font-size:16px;font-weight:700}
.gbtn:active{transform:scale(.97)}.gbtn svg{width:20px;height:20px}
.sep{display:flex;align-items:center;gap:12px;margin:18px 0 4px;color:var(--m);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:#ffffff14}
.lg-links{display:flex;justify-content:center;flex-wrap:wrap;margin-top:4px}
.lg-guest{color:var(--m);margin-top:12px}
.hd{display:flex;align-items:center;gap:14px}.hd h1{font-size:24px}.hd-av{width:54px;height:54px;font-size:24px;cursor:pointer}
.card.lvl{background:linear-gradient(135deg,#1f2a47,#141b2e);border:1px solid #ffffff12;border-radius:24px;margin-top:20px;padding:18px}
.lvl-r{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.stk{display:flex;align-items:center;gap:12px}.stk b{font-size:28px;line-height:1}.stk-i{width:42px;height:42px;border-radius:14px;background:#f5a5242b;color:var(--a);display:flex;align-items:center;justify-content:center}
.dots{display:flex;justify-content:space-between;margin-top:14px}.dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--m)}.dot i{width:26px;height:26px;border-radius:50%;background:#ffffff0f}.dot.on i{background:var(--a);box-shadow:0 0 12px #f5a52466}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.wk{display:flex;gap:8px;height:110px}.wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--m)}.wb{flex:1;width:100%;background:#ffffff0a;border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}.wb i{display:block;width:100%;background:linear-gradient(180deg,var(--b),#0f766e);border-radius:10px}.wb i.td{background:linear-gradient(180deg,#ffc14d,var(--a))}
.qa{display:flex;gap:10px;margin-top:12px}.qa button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700}.qa-p{background:var(--a);color:#1a1200}.qa-s{background:var(--s2);color:var(--t)}.qa button:active{transform:scale(.97)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{position:relative;text-align:left;border:2px solid transparent;border-radius:20px;padding:14px;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sc span{position:absolute;top:8px;right:12px;font-size:40px}.sc b{font-size:17px}.sc em{font-style:normal;font-size:12px;opacity:.8}
.sc.on{border-color:var(--a);box-shadow:0 0 0 3px #f5a52433}.sc:active{transform:scale(.97)}
.ex-i{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pl{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;flex:none}.pl svg{width:16px;height:16px}
.fg{background:#eef4f2;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab}.fgc{background:var(--s);border-radius:22px;margin-top:14px;padding:10px 12px 12px;text-align:center}.fg svg{width:100%;max-width:300px;height:170px}.rd{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:6px}
.pr{font-size:96px;font-weight:800;line-height:1.1;color:var(--a);animation:pp 1s ease-out infinite}@keyframes pp{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.mdl{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:999;padding:24px}.mb{background:var(--s);border-radius:22px;padding:24px;max-width:340px;width:100%;text-align:center}.mb p{margin:10px 0 18px}
.se-h{border-radius:24px;padding:14px 18px 22px;text-align:center;color:#fff}
.se-h h1{font-size:24px;margin-top:6px}.se-h p{margin-top:6px;font-size:14px;opacity:.85;line-height:1.4}.se-ic{display:block;font-size:56px;margin-top:6px}
.se-x{display:block;background:#0000004d;border:0;color:#fff;border-radius:99px;padding:8px 14px;font-weight:600}
.se-dots{display:flex;justify-content:center;gap:8px;margin-bottom:16px}.se-dots i{width:28px;height:6px;border-radius:9px;background:#ffffff1f}.se-dots i.dn{background:var(--b)}.se-dots i.cur{background:var(--a)}
.pz{display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;border:0;background:var(--s2);margin:18px auto 0;box-shadow:0 0 0 2px var(--a)}
.pz svg{fill:var(--a)}
.seg{display:flex;background:var(--s);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:0;color:var(--m);padding:10px;border-radius:11px;font-weight:700;font-size:15px}.seg button.on{background:var(--a);color:#1a1200}
.pdc{background:linear-gradient(160deg,#1f2a47,#141b2e);border:1px solid #ffffff12;border-radius:24px;padding:6px 14px 0;overflow:hidden}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:16px 0 0}
.pc{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pc b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc em{font-style:normal;font-size:12px;color:var(--m)}.pc.you b{color:var(--a)}
.pav{width:52px;height:52px;font-size:22px;margin-bottom:6px}.pav.f{width:64px;height:64px;font-size:26px}
.pb{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin-top:6px}
.rw{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px}.rw>b{width:24px;text-align:center;color:var(--m)}.rw.you{background:var(--s2);outline:1px solid var(--a)}
.rw>em{font-style:normal;font-weight:700;font-size:14px}.rw .av{flex:none}
.rn{display:flex;align-items:center;gap:8px;font-weight:600}.rn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.sm{font-size:11px;padding:2px 8px}.bar.sm{height:6px;margin:6px 0 0}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rs{text-align:center;margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pcard{margin-top:18px;text-align:center;border-radius:26px;padding:22px 18px}
.pa{width:100px;height:100px;font-size:46px;cursor:pointer}
.bd.on{background:linear-gradient(160deg,#f5a52433,#141b2e);border:1px solid #f5a52466;color:var(--t)}
.pgr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body{padding-bottom:calc(108px + env(safe-area-inset-bottom))}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;border:1px solid #ffffff14;border-radius:26px;padding:6px 4px;background:#141b2ef2;box-shadow:0 10px 30px #00000066}
nav button{padding:6px 0 4px}
nav i{width:48px;height:30px;margin:0 auto 2px;border-radius:99px;display:flex;align-items:center;justify-content:center}
nav button.on i{background:#f5a5242b}
#tt{bottom:112px}
.inst{display:flex;align-items:center;gap:12px;margin-top:12px;background:linear-gradient(135deg,#f5a52422,#141b2e);border:1px solid #f5a52444}
.inst-i{width:44px;height:44px;border-radius:14px;background:var(--a);color:#1a1200;display:flex;align-items:center;justify-content:center;flex:none}
.inst b{font-size:15px}.inst p{margin-top:2px;font-size:13px}
.up{margin:14px auto;max-width:280px;padding:16px;border-radius:22px;border:1px solid var(--c,#f5a524);background:linear-gradient(160deg,#f5a52422,#141b2e);box-shadow:0 0 40px color-mix(in srgb,var(--c,#f5a524) 30%,transparent)}
.up span{font-size:13px;color:var(--m)}.up b{display:block;font-size:44px;line-height:1.1;color:var(--c,var(--a))}.up p{margin-top:4px;font-weight:700}

function okRs(){q.s=1;q.r=0;q.t=0;q.rest=0;q.ask=false;q.run=true;q.prep=PRE();draw()}
function start(i){const[m,u]=mvOf(E[i].n);q={e:E[i],s:1,r:0,t:0,rest:0,run:true,prep:PRE(),m,u,ph:0};cam.yaw=0;cam.el=0;cam.zm=1;$("ses").style.display="block";clearInterval(tm);tm=setInterval(tick,1000);cancelAnimationFrame(fr);lt=0;fr=requestAnimationFrame(loop);draw()}
function tick(){if(!q||!q.run)return;if(q.prep>0){q.prep--;beep(q.prep?660:990,q.prep?90:300);if(!q.prep)navigator.vibrate&&navigator.vibrate(300)}else if(q.rest>0){if(--q.rest==0){q.s++;q.r=0;navigator.vibrate&&navigator.vibrate(200)}}else q.t++;draw()}
function rep(){if(q.prep>0||q.rest>0)return;if(++q.r>=q.e.r){if(q.s>=q.e.s)return fin();q.rest=q.e.d}draw()}
function draw(){const{e,s,r,t,rest,prep}=q;
$("ses").innerHTML=`<div class="app"><div class="se-h ph ph-${e.sp}"><button class="se-x" onclick="quit()">‹ Salir</button><div><span class="se-ic">${e.ic}</span><h1>${e.n}</h1><p>${e.t}</p></div></div>
<div class="fgc"><div id="fg" class="fg">${fig()}</div><div class="chips" style="justify-content:center;margin-top:8px"><button class="chip" onclick="setV('s')">Lado</button><button class="chip" onclick="setV('f')">Frente</button><button class="chip" onclick="setV('b')">Espalda</button><button class="chip" onclick="setV('a')">Arriba</button></div><p class="m" style="margin-top:8px"><i class="rd"></i>Músculos: ${[...q.u].map(k=>MU[k]).join(" · ")}</p><p class="m" style="font-size:12px">Arrastra para girar · pellizca para acercar</p></div>
<div class="center">${prep>0?`<p class="st" style="font-size:20px;margin-bottom:0">¡Prepárate!</p><div class="pr">${prep}</div><p class="m">Colócate en posición, empezamos en ${prep} s</p><div class="chips" style="justify-content:center;margin:12px 0"><button class="chip ${PRE()==5?"on":""}" onclick="setPre(5)">5 s</button><button class="chip ${PRE()==10?"on":""}" onclick="setPre(10)">10 s</button></div><button class="btn" onclick="q.prep=0;draw()">Empezar ya</button>`
:`<div class="timer">${mm(rest>0?rest:t)}</div><p class="st">${rest>0?"Descansa, la siguiente serie ya viene":q.run?"En marcha":"En pausa"}</p>
<div class="se-dots">${Array.from({length:e.s},(_,k)=>`<i class="${k<s-1?"dn":k==s-1?"cur":""}"></i>`).join("")}</div>
<div class="row"><div class="card stat"><b>${s}/${e.s}</b><span>Serie</span></div><div class="card stat"><b>${r}/${e.r}</b><span>Repetición</span></div></div>
<button class="btn" onclick="rep()">Repetición hecha</button>`}
<div style="display:flex;justify-content:center;gap:18px"><button class="pz" style="margin-left:0;margin-right:0" onclick="q.run=!q.run;draw()" aria-label="${q.run?"Pausar":"Seguir"}">${q.run?PA:PY}</button><button class="pz" style="margin-left:0;margin-right:0" onclick="askRs()" aria-label="Reiniciar">${RS}</button></div></div>
${q.ask?`<div class="mdl"><div class="mb"><b style="font-size:19px">¿Reiniciar el ejercicio?</b><p class="m">Se perderá el avance de esta sesión: series, repeticiones y tiempo.</p><div class="row"><button class="btn" style="background:var(--s2);color:var(--t,#fff)" onclick="noRs()">Cancelar</button><button class="btn" onclick="okRs()">Aceptar</button></div></div></div>`:""}</div>`}
async function fin(){clearInterval(tm);const e=q.e,t=q.t,xp=30+e.s*10,b=tot(),bi=rk(b),bl=lv(b);q=null;let fail="";
$("ses").innerHTML='<div class="app center"><p class="m">Guardando…</p></div>';
try{if(U){const w={id:newId(),exercise:e.n,sport:SP[e.sp][1],place:e.pl,series:e.s,reps:e.r,durationSec:t,xp,at:Date.now()};qSet(qGet().concat(w));applyLocal(w);cacheSet();sync()}
else{S.xp[e.sp]+=xp;S.r.unshift({n:e.n,ic:e.ic,sp:e.sp,t,d:hoy(),xp});save()}
enviarRegistro({jugador:V().name,deporte:SP[e.sp][1],ejercicio:e.n,lugar:e.pl=="casa"?"casa":"gimnasio",xp})}
catch(err){fail=msg(err)||String(err.code||err.message)}
const a=tot();
$("ses").innerHTML=fail?`<div class="app"><div class="center"><div class="bigic">⚠️</div><h1>No se guardó</h1><p class="m" style="margin-top:10px">${esc(fail)}</p><button class="btn" onclick="closeS()">Volver</button></div></div>`:
`<div class="app"><div class="center"><div class="bigic pop">🏆</div><h1>¡Entrenamiento completado!</h1><div class="timer">+${xp} XP</div>
${lv(a)>bl?`<div class="up pop"><span>Nivel</span><b>${lv(a)}</b><p>¡Subiste de nivel!</p></div>`:""}${rk(a)>bi?`<div class="up pop" style="--c:${RK[rk(a)][2]}"><span>Nuevo rango</span><b>${RK[rk(a)][0]}</b><p>¡Lo lograste!</p></div>`:""}<div class="bar" style="max-width:280px;margin:14px auto 4px"><i style="width:${(a%200)/2}%"></i></div><p class="m">${a%200} de 200 XP para el nivel ${lv(a)+1}</p>
<button class="btn" onclick="closeS('rank')">Ver mi ranking</button><button class="btn g" onclick="closeS()">Seguir entrenando</button></div></div>`}
const closeS=t=>{$("ses").style.display="none";go(t||"train")},quit=()=>{clearInterval(tm);q=null;closeS()};
const rkCard=()=>{const x=tot(),i=rk(x),n=RK[i+1];return`<div class="card" style="margin-top:18px"><span class="badge" style="background:${RK[i][2]}">${RK[i][0]}</span><div class="big">${x} XP</div>
<div class="bar"><i style="width:${n?(x-RK[i][1])/(n[1]-RK[i][1])*100:100}%"></i></div><p class="m">${n?`Te faltan ${n[1]-x} XP para ${n[0]}`:"Llegaste al rango máximo"}</p></div>`};
const PC=["#f5a524","#c0c8d8","#cd7f32"];
function podium(L){return`<div class="pod">${[1,0,2].filter(k=>L[k]).map(k=>{const p=L[k];return`<div class="pc ${p.uid==U.uid?"you":""}"><span class="av pav${k==0?" f":""}" style="box-shadow:0 0 0 3px ${PC[k]}">${av(p)}</span><b>${esc(p.name)}</b><em>${p.x} XP</em><div class="pb" style="height:${[96,72,56][k]}px;background:linear-gradient(180deg,${PC[k]}55,${PC[k]}11);border-top:3px solid ${PC[k]}">${k+1}</div></div>`}).join("")}</div>`}
function rows(L){const mx=Math.max(...L.map(p=>p.x),1);return L.slice(3).map((p,j)=>{const r=RK[rk(p.x)];return`<div class="rw ${p.uid==U.uid?"you":""}"><b>${j+4}</b><span class="av">${av(p)}</span><div style="flex:1;min-width:0"><div class="rn"><span>${esc(p.name)}</span><span class="badge sm" style="background:${r[2]}">${r[0]}</span></div><div class="bar sm"><i style="width:${p.x/mx*100}%"></i></div></div><em>${p.x} XP</em></div>`}).join("")}
function ownRow(){const v=V(),x=rs=="global"?tot():v.xp[Object.keys(GK).find(k=>GK[k]==rs)];return`<div class="card" style="margin-top:10px"><div class="rw you"><b>–</b><span class="av">${av(v)}</span><div style="flex:1"><div class="rn"><span>${esc(v.name)}</span></div><p class="m">${x?"Fuera del top 20":"Entrena para entrar al ranking"}</p></div><em>${x} XP</em></div></div>`}
async function rank(){const ch=(a,c,f)=>a.map(([k,l])=>`<button class="chip ${c==k?"on":""}" onclick="${f}('${k}')">${l}</button>`).join("");
const sp=`<h2>Tu rango en cada deporte</h2><div class="rg">${Object.entries(SP).map(([k,v])=>{const y=V().xp[k],j=rk(y);return`<div class="card rs"><span style="font-size:28px">${v[0]}</span><b>${v[1]}</b><span class="m">${y} XP</span><span class="badge" style="background:${RK[j][2]}">${RK[j][0]}</span></div>`}).join("")}</div>`;
$("main").innerHTML=`<h1>Ranking</h1>${U?`<div class="seg" style="margin-top:16px"><button class="${rt=="w"?"on":""}" onclick="stt('w')">Mundial</button><button class="${rt=="f"?"on":""}" onclick="stt('f')">Amigos</button></div>${rt=="w"?`<div class="chips" style="margin-top:10px">${ch([["global","Todos"],...Object.entries(SP).map(([k,v])=>[GK[k],v[0]+" "+v[1]])],rs,"ssp")}</div>`:""}<div id="rl" style="margin-top:12px"><div class="card m">Cargando…</div></div>`
:'<div class="card m" style="margin-top:16px">Inicia sesión para ver el ranking en línea y competir con tus amigos.</div><button class="btn" onclick="authUI()">Iniciar sesión</button>'}${rkCard()}${sp}`;
if(!U)return;const t0=tab;
try{let L,old=false;const key="sportx_rk_"+rt+"_"+rs;
try{L=rt=="w"?(await T(C.ranking(rs,20))).map(p=>({uid:p.uid,name:p.displayName||p.username,x:p.score,photo:p.photo})):(await T(C.friendsRanking())).map(p=>({uid:p.uid,name:p.displayName||p.username,x:p.xp,photo:p.photo}));jset(key,L)}
catch(e){L=jget(key,null);if(!L)throw e;old=true}
if(tab!=t0||!$("rl"))return;
$("rl").innerHTML=(old?'<div class="card m">Sin conexión: mostrando el último ranking guardado.</div>':"")+(L.length?`<div class="card pdc">${podium(L)}</div>`+(L.length>3?`<div class="card" style="margin-top:10px">${rows(L)}</div>`:""):'<div class="card m">Todavía nadie tiene XP aquí. ¡Sé el primero!</div>')+(rt=="w"&&!L.some(p=>p.uid==U.uid)?ownRow():"")+(rt=="f"&&!old?await friendsUI():"")}
catch(e){if($("rl"))$("rl").innerHTML=`<div class="card m">El ranking en línea necesita internet. Vuelve a intentarlo cuando tengas conexión.</div>`}}
const stt=k=>{rt=k;rank()},ssp=k=>{rs=k;rank()};
async function friendsUI(){const f=await C.friendships(),inc=f.filter(x=>x.incoming&&x.other);
return`<h2>Agregar amigo</h2><div class="card"><div class="fr"><input id="fu" placeholder="nombre de usuario" autocapitalize="none"><button class="btn sm" onclick="addF()">Agregar</button></div><p class="m" style="margin-top:8px">Tu usuario: @${esc(P.username)}</p></div>
${inc.length?"<h2>Solicitudes</h2>"+inc.map(x=>`<div class="card sp"><span class="av">${av({name:x.other.displayName,photo:x.other.photo})}</span><b style="flex:1">${esc(x.other.displayName)}</b><button class="btn sm" onclick="acc('${x.id}')">Aceptar</button></div>`).join(""):""}`}
async function addF(){const u=$("fu").value.trim();if(!u)return;try{await C.sendFriendRequest(u);toast("Solicitud enviada a @"+u.toLowerCase())}catch(e){toast(e.message||msg(e))}}
async function acc(id){try{await C.acceptFriend(id);rank()}catch(e){toast(msg(e))}}
function perfil(){const v=V(),h=v.h,x=tot(),r=RK[rk(x)],f=PF(),rc=f.ring||"#f5a524",g=f.goal||3,p=(x%200)/200;
const ds=new Set(h.filter(a=>a.d>=new Date(Date.now()-6*864e5).toLocaleDateString("sv-SE")).map(a=>a.d)),wd=ds.size,nsp=Object.values(v.xp).filter(a=>a>0).length;
const BG=[["🥇","Primer paso",v.n>=1],["🔥","Racha de 3",v.st>=3],["⚡","100 XP",x>=100],["💪","10 sesiones",v.n>=10],["🏅","Nivel 5",lv(x)>=5],["🌟","Rango Oro",rk(x)>=2],["🎯","Meta semanal",wd>=g],["🧩","Multideporte",nsp>=3]];
const gk=sp=>GR[Object.keys(GK).find(k=>GK[k]==sp)||sp]||GR.gen;
$("main").innerHTML=`<h1>Perfil</h1><div class="card pcard" style="background:linear-gradient(160deg,${rc}33,#141b2e 70%);border:1px solid ${rc}66">
<span class="av pa" style="box-shadow:0 0 0 4px ${rc},0 0 30px ${rc}55" onclick="pickAv()">${av(v)}</span>
<div style="font-size:22px;font-weight:800;margin-top:14px">${esc(v.name)}</div><p class="m">${v.user?"@"+esc(v.user):"Modo local"}</p>
<div style="margin-top:8px"><span class="badge" style="background:${r[2]}">${r[0]}</span> <span class="badge" style="background:#ffffff1f;color:var(--t)">Nivel ${lv(x)}</span>${f.fav?` <span class="badge" style="background:#ffffff1f;color:var(--t)">${SP[f.fav][0]} ${SP[f.fav][1]}</span>`:""}</div>
${f.motto?`<p style="margin-top:12px;font-style:italic">“${esc(f.motto)}”</p>`:""}${f.bio?`<p class="m" style="margin-top:8px;line-height:1.5">${esc(f.bio)}</p>`:'<p class="m" style="margin-top:12px">Cuéntale a los demás quién eres como deportista.</p>'}
<div class="bar" style="margin-top:16px"><i style="width:${p*100}%"></i></div><p class="m" style="font-size:12px">${x%200} de 200 XP para el nivel ${lv(x)+1}</p></div>
<div class="row"><div class="card stat"><b style="color:var(--blue,#60a5fa)">${v.n}</b><span>Entrenamientos</span></div><div class="card stat"><b style="color:var(--a)">${v.st}</b><span>Racha</span></div><div class="card stat"><b style="color:var(--b)">${x}</b><span>XP total</span></div></div>
<div class="card"><div class="ct" style="margin-bottom:0"><b>Meta semanal</b><span class="m">${wd} de ${g} días</span></div><div class="bar"><i style="width:${Math.min(100,wd/g*100)}%"></i></div><p class="m">${wd>=g?"¡Meta cumplida!":`Te faltan ${g-wd} ${g-wd==1?"día":"días"} en los últimos 7 días`}</p></div>
<h2>Insignias (${BG.filter(b=>b[2]).length} de ${BG.length})</h2><div class="bg">${BG.map(b=>`<div class="bd ${b[2]?"on":"off"}"><i>${b[0]}</i>${b[1]}</div>`).join("")}</div>
<button class="btn" onclick="editPf()">Editar mi perfil</button><p class="m" style="margin-top:8px;font-size:12px;text-align:center">Reseña, lema, meta y color se guardan en este dispositivo, separados por cuenta.</p>
<div class="row"><button class="btn g" onclick="pickAv()">Cambiar foto</button><button class="btn g" onclick="rn()">Cambiar nombre</button></div>${instBlock()}
${U?`<button class="btn g" onclick="out()">Cerrar sesión</button>`:'<div class="card m" style="margin-top:12px">Estás en modo local. Crea una cuenta para guardar tu XP en la nube y entrar al ranking.</div><button class="btn" onclick="authUI()">Crear cuenta o iniciar sesión</button>'}
<h2>Historial</h2>${h.length?h.slice(0,30).map(r=>{const g2=gk(r.sp);return`<div class="card ex"><span class="ex-i" style="background:linear-gradient(135deg,${g2[0]},${g2[1]})">${r.ic}</span><div><b>${esc(r.n)}</b><div class="m">${r.d}, ${mm(r.t)}, +${r.xp} XP</div></div></div>`}).join(""):'<div class="card m">Todavía no hay entrenamientos. Completa el primero para empezar tu historial.</div>'}
${v.n?'<button class="btn g" onclick="del()">Borrar historial y puntos</button>':""}`}
const RC=["#f5a524","#2dd4bf","#60a5fa","#c084fc","#fb7185","#4ade80"];let ed=null;
function editPf(){ed=Object.assign({bio:"",motto:"",fav:"",goal:3,ring:RC[0]},PF());edDraw()}
function edSet(k,v){ed.bio=$("eb").value;ed.motto=$("em2").value;ed[k]=v;edDraw()}
function edDraw(){$("pk").style.display="flex";$("pk").innerHTML=`<div class="sh" style="max-height:92vh;overflow:auto"><b style="font-size:18px">Editar mi perfil</b>
<textarea id="eb" maxlength="140" rows="3" placeholder="Sobre mí: cuenta quién eres como deportista">${esc(ed.bio)}</textarea><input id="em2" maxlength="40" placeholder="Tu lema" value="${esc(ed.motto)}">
<h2>Deporte favorito</h2><div class="chips">${Object.entries(SP).map(([k,s])=>`<button class="chip ${ed.fav==k?"on":""}" onclick="edSet('fav','${k}')">${s[0]} ${s[1]}</button>`).join("")}</div>
<h2>Meta semanal (días)</h2><div class="chips">${[1,2,3,4,5,6,7].map(d=>`<button class="chip ${ed.goal==d?"on":""}" onclick="edSet('goal',${d})">${d}</button>`).join("")}</div>
<h2>Color de tu marco</h2><div class="ag">${RC.map(c=>`<button class="av" style="background:${c};border:0;width:40px;height:40px;${ed.ring==c?"outline:3px solid #fff":""}" onclick="edSet('ring','${c}')"></button>`).join("")}</div>
<button class="btn" onclick="edSave()">Guardar</button><button class="lnk" style="width:100%" onclick="$('pk').style.display='none'">Cancelar</button></div>`}
function edSave(){ed.bio=$("eb").value.trim();ed.motto=$("em2").value.trim();setPF(ed);$("pk").style.display="none";perfil()}
const AVS=["😎","🦁","🐯","🦅","🐺","🦈","⚽","🏀","🏐","💪","🔥","🏆"];
function pickAv(){const p=$("pk");p.style.display="flex";
p.innerHTML=`<div class="sh"><b style="font-size:18px">Foto de perfil</b><div class="ag">${AVS.map(a=>`<button class="av" style="width:56px;height:56px;font-size:28px;border:0;color:inherit" onclick="setAv('emoji:${a}')">${a}</button>`).join("")}</div>
<label class="btn" style="text-align:center;margin-top:0">Elegir de la galería<input type="file" accept="image/*" hidden onchange="fromFile(this)"></label>
<button class="btn g" onclick="setAv('')">Quitar foto</button><button class="lnk" style="width:100%" onclick="$('pk').style.display='none'">Cancelar</button></div>`}
async function setAv(v){try{if(U){if(P)P.photo=v||null;cacheSet();ppSet(Object.assign(ppGet(),{photo:v||null}));sync()}else{S.photo=v||null;save()}$("pk").style.display="none";perfil()}catch(e){toast(msg(e)||"No se pudo guardar la foto")}}
function fromFile(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(im.width,im.height);
c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(u);setAv(c.toDataURL("image/jpeg",.8))};
im.onerror=()=>toast("No se pudo leer esa imagen");im.src=u}
async function rn(){const n=prompt("¿Cómo te llamas?",V().name);if(!n||!n.trim())return;
try{if(U){const nn=n.trim().slice(0,20);if(P)P.displayName=nn;cacheSet();ppSet(Object.assign(ppGet(),{displayName:nn}));sync()}else{S.name=n.trim().slice(0,20);save()}perfil()}catch(e){toast(msg(e))}}
async function del(){if(!confirm("¿Borrar todo tu historial y tus puntos?"))return;
try{if(U){await T(C.resetAll(),20000);qSet([]);await refresh()}else{S=Object.assign(fresh(),{name:S.name,photo:S.photo,pf:S.pf});save()}perfil()}catch(e){toast(msg(e))}}
async function out(){if(!confirm("¿Cerrar sesión?"))return;localStorage.removeItem("sportx_guest");localStorage.removeItem("sportx_lu");try{await C.logout()}catch(e){toast(msg(e))}}
addEventListener("online",()=>tab=="home"&&!q&&home());addEventListener("offline",()=>tab=="home"&&!q&&home());
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
