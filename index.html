<script>
const URL_API="https://script.google.com/macros/s/AKfycbytMxshOI2B2Z1uUw8PhozdfwrHuAhQ2Th3NUjmJ4cm60Qd0e7VNQr8YvjcpXn0dz4/exec";

  fetch(URL_API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(r)}).catch(()=>{});
}
const SP={fut:["⚽","Fútbol"],vol:["🏐","Voleibol"],bas:["🏀","Basquetbol"],gen:["💪","General"]};

const E=`fut|casa|⚽|Toques de balón en sitio|3|40|30|Mantén el balón cerca y alterna ambos pies.

vol|casa|🦘|Saltos de bloqueo|4|8|45|Brazos arriba y aterrizaje suave con rodillas flexionadas.

gen|casa|🧘|Plancha (segundos)|3|30|30|Codos bajo los hombros, abdomen apretado.

gen|gym|🏃|Caminadora por intervalos|5|1|60|Un minuto rápido y uno suave en cada serie.`.split("\n").map(l=>{const a=l.split("|");return{sp:a[0],pl:a[1],ic:a[2],n:a[3],s:+a[4],r:+a[5],d:+a[6],t:a[7]}});
const RK=[["Bronce",0,"#cd7f32"],["Plata",300,"#c0c8d8"],["Oro",800,"#f5a524"],["Platino",1600,"#2dd4bf"],["Diamante",3000,"#60a5fa"],["Élite",5000,"#c084fc"]];
const EM={"auth/invalid-email":"El correo no es válido","auth/missing-password":"Escribe tu contraseña","auth/invalid-credential":"Correo o contraseña incorrectos","auth/wrong-password":"Correo o contraseña incorrectos","auth/user-not-found":"Correo o contraseña incorrectos","auth/email-already-in-use":"Ese correo ya tiene cuenta","auth/weak-password":"La contraseña necesita al menos 6 caracteres","auth/popup-closed-by-user":"","auth/cancelled-popup-request":"","auth/network-request-failed":"Sin conexión a internet"};

const fresh=()=>({r:[],xp:{fut:0,vol:0,bas:0,gen:0},name:"Atleta"});
let S=JSON.parse(localStorage.getItem("sportx2")||"null")||fresh(),tab="home",fs="all",fp="all",q=null,tm=null,dp=null;

const RC=["#f5a524","#2dd4bf","#60a5fa","#c084fc","#fb7185","#4ade80"];let ed=null;
function editPf(){ed=Object.assign({bio:"",motto:"",fav:"",goal:3,ring:RC[0]},S.pf||{});edDraw()}
function edSet(k,v){ed.bio=$("eb").value;ed.motto=$("em2").value;ed[k]=v;edDraw()}
function edDraw(){$("pk").style.display="flex";$("pk").innerHTML=`<div class="sh" style="max-height:92vh;overflow:auto"><b style="font-size:18px">Editar mi perfil</b>
<textarea id="eb" maxlength="140" rows="3" placeholder="Sobre mí: cuenta quién eres como deportista">${esc(ed.bio)}</textarea><input id="em2" maxlength="40" placeholder="Tu lema" value="${esc(ed.motto)}">
<h2>Deporte favorito</h2><div class="chips">${Object.entries(SP).map(([k,s])=>`<button class="chip ${ed.fav==k?"on":""}" onclick="edSet('fav','${k}')">${s[0]} ${s[1]}</button>`).join("")}</div>
<h2>Meta semanal (días)</h2><div class="chips">${[1,2,3,4,5,6,7].map(d=>`<button class="chip ${ed.goal==d?"on":""}" onclick="edSet('goal',${d})">${d}</button>`).join("")}</div>
<h2>Color de tu marco</h2><div class="ag">${RC.map(c=>`<button class="av" style="background:${c};border:0;width:40px;height:40px;${ed.ring==c?"outline:3px solid #fff":""}" onclick="edSet('ring','${c}')"></button>`).join("")}</div>
<button class="btn" onclick="edSave()">Guardar</button><button class="lnk" style="width:100%" onclick="$('pk').style.display='none'">Cancelar</button></div>`}
function edSave(){ed.bio=$("eb").value.trim();ed.motto=$("em2").value.trim();S.pf=ed;save();$("pk").style.display="none";perfil()}
const AVS=["😎","🦁","🐯","🦅","🐺","🦈","⚽","🏀","🏐","💪","🔥","🏆"];
function pickAv(){const p=$("pk");p.style.display="flex";
p.innerHTML=`<div class="sh"><b style="font-size:18px">Foto de perfil</b><div class="ag">${AVS.map(a=>`<button class="av" style="width:56px;height:56px;font-size:28px;border:0;color:inherit" onclick="setAv('emoji:${a}')">${a}</button>`).join("")}</div>
<label class="btn" style="text-align:center;margin-top:0">Elegir de la galería<input type="file" accept="image/*" hidden onchange="fromFile(this)"></label>
<button class="btn g" onclick="setAv('')">Quitar foto</button><button class="lnk" style="width:100%" onclick="$('pk').style.display='none'">Cancelar</button></div>`}
async function setAv(v){try{if(U){await C.saveProfile({photo:v||null});await refresh()}else{S.photo=v||null;save()}$("pk").style.display="none";perfil()}catch(e){toast(msg(e)||"No se pudo guardar la foto")}}
function fromFile(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(im.width,im.height);
c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(u);setAv(c.toDataURL("image/jpeg",.8))};
im.onerror=()=>toast("No se pudo leer esa imagen");im.src=u}
async function rn(){const n=prompt("¿Cómo te llamas?",V().name);if(!n||!n.trim())return;
try{if(U){await C.saveProfile({displayName:n.trim().slice(0,20)});await refresh()}else{S.name=n.trim().slice(0,20);save()}perfil()}catch(e){toast(msg(e))}}
async function del(){if(!confirm("¿Borrar todo tu historial y tus puntos?"))return;
try{if(U){await C.resetAll();await refresh()}else{S=Object.assign(fresh(),{name:S.name,photo:S.photo,pf:S.pf});save()}perfil()}catch(e){toast(msg(e))}}
async function out(){if(!confirm("¿Cerrar sesión?"))return;localStorage.removeItem("sportx_guest");try{await C.logout()}catch(e){toast(msg(e))}}
addEventListener("online",()=>tab=="home"&&home());addEventListener("offline",()=>tab=="home"&&home());
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script></body></html>
