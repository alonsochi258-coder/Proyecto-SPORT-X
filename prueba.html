<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPORTX - Prueba de Firebase</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; background:#0b1020; color:#f4f6fb; margin:0; padding:20px; max-width:520px; margin-inline:auto; }
  h1 { font-size:22px; } h2 { font-size:16px; color:#f5a623; margin:22px 0 8px; }
  input, button { font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #3a4a7a; margin:4px 0; }
  input { width:100%; box-sizing:border-box; background:#161c34; color:#f4f6fb; }
  button { background:#f5a623; color:#0b1020; border:0; font-weight:600; cursor:pointer; margin-right:6px; }
  button.sec { background:#1e2748; color:#f4f6fb; border:1px solid #3a4a7a; }
  pre { background:#161c34; padding:12px; border-radius:10px; overflow:auto; font-size:13px; }
  #msg { margin-top:12px; padding:10px; border-radius:10px; background:#161c34; min-height:20px; }
  .ok { color:#2ec4b6; } .err { color:#ff8a80; }
</style>
</head>
<body>
<h1>SPORTX · Prueba de Firebase</h1>
<div id="msg">Cargando Firebase...</div>

<div id="out" style="display:none">
  <h2>Acceso</h2>
  <input id="em" type="email" placeholder="Correo">
  <input id="pw" type="password" placeholder="Contraseña (mínimo 6 caracteres)">
  <input id="nm" type="text" placeholder="Nombre (solo para crear cuenta)">
  <div>
    <button id="bIn">Iniciar sesión</button>
    <button id="bUp" class="sec">Crear cuenta</button>
  </div>
  <div>
    <button id="bG" class="sec">Google</button>
    <button id="bF" class="sec">Facebook</button>
  </div>
</div>

<div id="inn" style="display:none">
  <h2>Mi perfil</h2>
  <pre id="perfil">...</pre>
  <button id="bW">Guardar entrenamiento de prueba (3 series)</button>
  <button id="bOut" class="sec">Cerrar sesión</button>
  <h2>Ranking mundial</h2>
  <pre id="rank">...</pre>
  <h2>Mi historial</h2>
  <pre id="hist">...</pre>
</div>

<script type="module" src="firebase.js"></script>
<script type="module">
  const C = window.SportXCloud;
  const $ = (id) => document.getElementById(id);
  const say = (t, cls) => { $('msg').className = cls || ''; $('msg').textContent = t; };
  const fail = (e) => say('Error: ' + (e.code || e.message), 'err');

  async function refresh() {
    const p = await C.getProfile();
    $('perfil').textContent = JSON.stringify({ usuario: p.username, nombre: p.displayName, xp: p.xp, nivel: p.level, entrenamientos: p.workouts, racha: p.streak, xpPorDeporte: p.sportXp }, null, 2);
    const r = await C.ranking('global', 10);
    $('rank').textContent = r.length ? r.map((x, i) => `${i + 1}. ${x.username}  ${x.xp} XP`).join('\n') : 'Todavía nadie tiene XP';
    const h = await C.history(10);
    $('hist').textContent = h.length ? h.map((x) => `${x.exercise} · ${x.series} series · +${x.xp} XP`).join('\n') : 'Sin entrenamientos';
  }

  C.onAuth(async (user, err) => {
    if (err) { say('No se pudo cargar Firebase: ' + err.message, 'err'); return; }
    $('out').style.display = user ? 'none' : 'block';
    $('inn').style.display = user ? 'block' : 'none';
    if (user) { say('Sesión iniciada: ' + (user.email || user.displayName), 'ok'); try { await refresh(); } catch (e) { fail(e); } }
    else say('Sin sesión. Inicia sesión o crea una cuenta.');
  });

  $('bIn').onclick = () => C.emailSignIn($('em').value, $('pw').value).catch(fail);
  $('bUp').onclick = () => C.emailSignUp($('em').value, $('pw').value, $('nm').value).catch(fail);
  $('bG').onclick  = () => C.google().catch(fail);
  $('bF').onclick  = () => C.facebook().catch(fail);
  $('bOut').onclick = () => C.logout();
  $('bW').onclick = async () => {
    try {
      const r = await C.saveWorkout({ exercise: 'Sentadilla búlgara', sport: 'Fútbol', place: 'gimnasio', series: 3, reps: 10, durationSec: 300 });
      say('Entrenamiento guardado: +' + r.xp + ' XP', 'ok'); await refresh();
    } catch (e) { fail(e); }
  };
</script>
</body>
</html>
